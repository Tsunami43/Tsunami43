<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="Website">
<defs>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
  <linearGradient id="sweep" x1="0" x2="1">
    <stop offset="0" stop-color="#3dff8f" stop-opacity="0"/><stop offset=".5" stop-color="#3dff8f" stop-opacity=".22"/><stop offset="1" stop-color="#3dff8f" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes sweep{0%{transform:translateX(-60%)}55%,100%{transform:translateX(160%)}}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:1}97%{opacity:.6}}
  .blink{animation:blink 1s steps(2) infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}
  .sweep{animation:sweep 4.5s cubic-bezier(.6,0,.4,1) infinite}.flick{animation:flick 5s infinite}
</style>
